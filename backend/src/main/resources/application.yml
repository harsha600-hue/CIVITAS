
server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civitas}
    username: ${DB_USER:civitas}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 300000
      idle-timeout: 120000
      keepalive-time: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health

civitas:
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-tickets-per-booking: ${MAX_TICKETS:6}



