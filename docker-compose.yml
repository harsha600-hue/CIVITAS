services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: civitas, POSTGRES_USER: civitas, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U civitas"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/data/uploads]
    environment:
      DB_URL: jdbc:postgresql://db:5432/civitas
      DB_USER: civitas
      UPLOAD_DIR: /data/uploads
      DB_PASSWORD: "${DB_PASSWORD}"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]
volumes: { pgdata: {}, uploads: {} }

